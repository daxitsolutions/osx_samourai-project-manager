name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tests de non-régression
            command: swift test --parallel
          - name: Import Merlin
            command: |
              swiftc -swift-version 6 \
                Sources/SamouraiProjectManagerApp/Support/MerlinProjectImportService.swift \
                Tests/MerlinImportSmoke/main.swift \
                -o "$RUNNER_TEMP/merlin-import-smoke"
              "$RUNNER_TEMP/merlin-import-smoke"
          - name: Compilation Release
            command: swift build -c release --product SamouraiProjectManager
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Vérifier la chaîne Xcode
        run: |
          xcodebuild -version
          swift --version
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
